# Local development infrastructure (DEVELOPMENT §2). Values come from .env.
# Images are pinned; bump deliberately.
name: green-agro

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: gsa_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-gsa_owner_dev}
      POSTGRES_DB: gsa
      GSA_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-gsa_app_dev}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsa_owner -d gsa"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for photos and PDFs. MinIO stopped publishing
  # community images in 2025; production uses any S3-compatible service.
  # The bucket is created by the storage adapter on first use in development.
  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"gsa","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gsa_s3}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-gsa_s3_dev_secret}
    ports: ["8333:8333"]
    volumes: [seaweedfs:/data]

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  seaweedfs:
