# Local development infrastructure (DEVELOPMENT §2). Values come from .env.
# Images are pinned; bump deliberately. Object storage is Cloudflare R2, not a
# local service (ADR-0020).
name: green-agro

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: gsa_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-gsa_owner_dev}
      POSTGRES_DB: gsa
      GSA_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-gsa_app_dev}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./packages/db/sql:/bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsa_owner -d gsa"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
