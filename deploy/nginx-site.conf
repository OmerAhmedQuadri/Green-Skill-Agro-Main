# Green Skill Agro behind the VPS's nginx (ADR-0021, ADR-0035). setup-vps.sh fills
# in __DOMAIN__ and __PORT__; certbot then adds the certificate and the
# redirect from http. The headers are not optional (DEVELOPMENT §9). The
# domain is proxied by Cloudflare, so $remote_addr — and X-Real-IP — must be
# rebuilt from CF-Connecting-IP, trusted only from Cloudflare's addresses.
server {
  listen 80;
  server_name __DOMAIN__;

  client_max_body_size 8m;   # bulk-import files pass through the app; photos go straight to R2
  include snippets/cloudflare-realip.conf;   # the visitor's address, not Cloudflare's (setup-vps.sh)
  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    proxy_pass         http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;   # the only client IP the app trusts
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
