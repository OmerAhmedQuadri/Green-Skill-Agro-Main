# PostgreSQL for a copy of the app on the VPS (ADR-0035, ADR-0058): the
# development image and the same setup scripts — the two roles (ADR-0008) and
# bootstrap.sql. Each copy runs its own, as Compose project green-agro-<copy>
# (its own container and volume), on its own loopback port — never published
# beyond loopback: Docker's port rules bypass the host firewall. Used through
# deploy/lib.sh, which names the project and the port.

services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: gsa_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in .env}
      POSTGRES_DB: gsa
      GSA_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:?set by deploy/lib.sh}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ../packages/db/sql:/bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsa_owner -d gsa"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
